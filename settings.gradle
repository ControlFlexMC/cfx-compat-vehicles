pluginManagement {
    repositories {
        gradlePluginPortal() {
            // UniMined pulls a log4j that clashes with the one MC ships.
            content { excludeGroup('org.apache.logging.log4j') }
        }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'WagYourTail'; url = 'https://maven.wagyourtail.xyz/releases' }
        maven { name = 'WagYourTailSnapshots'; url = 'https://maven.wagyourtail.xyz/snapshots' }
    }

    plugins {
        // ModDevGradle's NFRT refuses MC pre-1.17, and ForgeGradle did not resolve official
        // names for 1.16.5 here. UniMined handles the whole pre-1.17 range, same as the
        // ControlFlex 1.12.2 line uses.
        id 'xyz.wagyourtail.unimined' version '1.4.1'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'cfx-compat-vehicles'
