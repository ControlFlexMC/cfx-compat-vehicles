pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }

    plugins {
        id 'net.neoforged.moddev' version '2.0.141'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'cfx-compat-vehicles'
