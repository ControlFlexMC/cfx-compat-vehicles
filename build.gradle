plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'cfx-compat-vehicles'
}

version = "${mod_version}-mc${minecraft_version}-neoforge"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

// net.neoforged.moddev has no mixin {} DSL, and this mod needs no refmap: its only mixin
// targets a third-party class with remap = false. So the config is declared in
// neoforge.mods.toml ([[mixins]]) and no annotation processor is wired up.
neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    // ControlFlex API (plain Java, loader-agnostic), resolved from JitPack.
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    compileOnly 'org.jetbrains:annotations:24.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    // compileOnly does not reach the test classpath; tests load the API-backed classes.
    testImplementation "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    def expandProps = [
        'mod_id'                 : mod_id,
        'mod_name'               : mod_name,
        'mod_version'            : mod_version,
        'mod_authors'            : mod_authors,
        'mod_license'            : mod_license,
        'mod_description'        : mod_description,
        'minecraft_version'      : minecraft_version,
        'minecraft_version_range': minecraft_version_range,
        'neoforge_version'       : neoforge_version,
        'neoforge_version_range' : neoforge_version_range,
        'loader_version_range'   : loader_version_range,
        'java_version'           : java_version,
        'controlflex_mod_id'     : controlflex_mod_id,
        'controlflex_version_range': controlflex_version_range,
        'mts_version_range'      : mts_version_range,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    from(file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
