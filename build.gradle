plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined'
}

base {
    archivesName = 'cfx-compat-vehicles'
}

version = "${mod_version}-mc${minecraft_version}-forge"
group = maven_group

// MC 1.16.5 runs on Java 8; the sources stay Java 8 compatible on this branch.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://jitpack.io' }
}

unimined.minecraft {
    version minecraft_version

    mappings {
        // Official (Mojang) names, matching every other branch's source.
        mojmap()
    }

    minecraftForge {
        loader forge_version
        mixinConfig('cfx-compat-vehicles.mixins.json')
    }

    // MCP/official -> SRG for production, which is what the Forge client expects.
    defaultRemapJar = true
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ControlFlex API (plain Java, loader-agnostic). This branch needs the Java 8 build
    // (ControlFlexMC/control-flex-api jdk/1.8 line), not the Java 17 default.
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    compileOnly 'org.jetbrains:annotations:24.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    def expandProps = [
        'mod_id'                 : mod_id,
        'mod_name'               : mod_name,
        'mod_version'            : mod_version,
        'mod_authors'            : mod_authors,
        'mod_license'            : mod_license,
        'mod_description'        : mod_description,
        'minecraft_version'      : minecraft_version,
        'minecraft_version_range': minecraft_version_range,
        'forge_version'          : forge_version,
        'forge_version_range'    : forge_version_range,
        'loader_version_range'   : loader_version_range,
        'java_version'           : java_version,
        'controlflex_mod_id'     : controlflex_mod_id,
        'controlflex_version_range': controlflex_version_range,
        'mts_version_range'      : mts_version_range,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    manifest {
        attributes(['MixinConfigs': 'cfx-compat-vehicles.mixins.json'])
    }

    from(file('LICENSE')) { rename { "${it}_${mod_id}" } }
}
