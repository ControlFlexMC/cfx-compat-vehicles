plugins {
    id 'net.minecraftforge.gradle'
}

base {
    archivesName = 'cfx-compat-vehicles'
}

version = "${mod_version}-mc${minecraft_version}-forge"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

minecraft {
    // Official (Mojang) names in dev; reobfJar rewrites members to SRG for production.
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ControlFlex API (plain Java, loader-agnostic), resolved from JitPack.
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    compileOnly 'org.jetbrains:annotations:24.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    def expandProps = [
        'mod_id'                 : mod_id,
        'mod_name'               : mod_name,
        'mod_version'            : mod_version,
        'mod_authors'            : mod_authors,
        'mod_license'            : mod_license,
        'mod_description'        : mod_description,
        'minecraft_version'      : minecraft_version,
        'minecraft_version_range': minecraft_version_range,
        'forge_version'          : forge_version,
        'forge_version_range'    : forge_version_range,
        'loader_version_range'   : loader_version_range,
        'java_version'           : java_version,
        'controlflex_mod_id'     : controlflex_mod_id,
        'controlflex_version_range': controlflex_version_range,
        'mts_version_range'      : mts_version_range,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    // No refmap: the only mixin targets third-party code with remap = false, and the
    // annotation processor cannot validate a target class that is not on the classpath.
    manifest {
        attributes(['MixinConfigs': 'cfx-compat-vehicles.mixins.json'])
    }

    from(file('LICENSE')) { rename { "${it}_${mod_id}" } }
    finalizedBy 'reobfJar'
}
